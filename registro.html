
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Miraflores Pacific Hotel</title>
    <meta name="description" content="Crea tu cuenta en el Miraflores Pacific Hotel.">
    <link rel="icon" href="img/logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header-principal">
        <div class="logo-contenedor">
            <img src="img/logo.jpg" alt="Logo de Miraflores Pacific Hotel" class="logo-img">
            <p class="hotel-titulo">Miraflores Pacific Hotel</p>
        </div>
        <button class="boton-menu" id="botonMenu" type="button" aria-label="Mostrar u ocultar menú" aria-expanded="false" aria-controls="navegacionPrincipal">&#9776;</button>
        <nav class="navegacion-principal" id="navegacionPrincipal" aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="habitaciones.html">Habitaciones</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="libro-reclamaciones.html">Libro de reclamaciones</a></li>
                <li><a href="login.html" class="boton-login-nav activo">Iniciar sesión</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor-principal">
        <section class="tarjeta-oscura seccion-login">
            <h1 class="titulo-seccion">Crear cuenta</h1>

            <form class="formulario-login" action="#" method="post" id="formularioRegistro">

                <div class="grupo-campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre"http://127.0.0.1:3000/registro.html?vscode-livepreview=true
                        placeholder="Ingrese su nombre completo"
                        minlength="3" maxlength="60"
                        pattern="[A-Za-zÁÉÍÓÚáéíóúÜüÑñ ]+"
                        title="Ingrese un nombre válido, usando solo letras y espacios."
                        autocomplete="name" required>
                </div>

                <div class="grupo-campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo"
                        placeholder="Ingrese su correo electrónico"
                        maxlength="100"
                        autocomplete="email" required>
                </div>

                <div class="grupo-campo">
                    <label for="clave">Contraseña</label>
                    <input type="password" id="clave" name="clave"
                        placeholder="Cree una contraseña"
                        minlength="8" maxlength="30"
                        pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,30}"
                        title="La contraseña debe tener entre 8 y 30 caracteres, incluyendo al menos una letra y un número."
                        autocomplete="new-password" required>
                </div>

                <div class="grupo-campo">
                    <label for="clave-confirmar">Confirmar contraseña</label>
                    <input type="password" id="clave-confirmar" name="clave-confirmar"
                        placeholder="Repita su contraseña"
                        autocomplete="new-password" required>
                </div>

                <div class="acciones-login">
                    <button type="submit" class="btn-iniciar">Registrarme</button>
                    <a href="login.html" class="enlace-olvido">Ya tengo una cuenta</a>
                </div>

            </form>
        </section>
    </main>

    <footer class="pie-pagina">
        <div class="info-footer">
            <p>&copy; 2026 Miraflores Pacific Hotel. Todos los derechos reservados.</p>
            <p>Av. Grau 191, Miraflores, Lima - Perú</p>
        </div>
    </footer>

    <script>
        const formulario = document.getElementById('formularioRegistro');
        const nombre = document.getElementById('nombre');
        const correo = document.getElementById('correo');
        const clave = document.getElementById('clave');
        const confirmarClave = document.getElementById('clave-confirmar');

        nombre.addEventListener('input', function () {
            this.setCustomValidity('');

            if (this.value.trim().length > 0 && this.value.trim().length < 3) {
                this.setCustomValidity('El nombre debe tener al menos 3 caracteres.');
            } else if (this.value.trim().length >= 3 && !/^[A-Za-zÁÉÍÓÚáéíóúÜüÑñ ]+$/.test(this.value.trim())) {
                this.setCustomValidity('El nombre solo debe contener letras y espacios.');
            }
        });

        correo.addEventListener('input', function () {
            this.setCustomValidity('');

            if (this.value && !this.validity.valid) {
                this.setCustomValidity('Ingrese un correo electrónico válido.');
            }
        });

        clave.addEventListener('input', function () {
            this.setCustomValidity('');

            if (this.value.length > 0 && this.value.length < 8) {
                this.setCustomValidity('La contraseña debe tener al menos 8 caracteres.');
            } else if (this.value && !/(?=.*[A-Za-z])(?=.*[0-9]).{8,30}/.test(this.value)) {
                this.setCustomValidity('La contraseña debe incluir al menos una letra y un número.');
            }

            validarCoincidencia();
        });

        confirmarClave.addEventListener('input', validarCoincidencia);

        function validarCoincidencia() {
            confirmarClave.setCustomValidity('');

            if (confirmarClave.value && confirmarClave.value !== clave.value) {
                confirmarClave.setCustomValidity('Las contraseñas no coinciden.');
            }
        }

        formulario.addEventListener('submit', function (event) {
            validarCoincidencia();

            if (!formulario.checkValidity()) {
                event.preventDefault();
                formulario.reportValidity();
            }
        });
    </script>

    <script src="js/menuResponsivo.js"></script>
</body>
</html>
