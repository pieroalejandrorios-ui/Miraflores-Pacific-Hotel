<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Miraflores Pacific Hotel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header-principal">
        <div class="logo-contenedor">
            <img src="img/logo.jpg" alt="Logo de Miraflores Pacific Hotel" class="logo-img">
            <p class="hotel-titulo">Miraflores Pacific Hotel</p>
        </div>
        <nav class="navegacion-principal" aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="habitaciones.html">Habitaciones</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="libro-reclamaciones.html">Libro de reclamaciones</a></li>
                <li><a href="login.html" class="boton-login-nav activo">Iniciar sesión</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor-principal">
        <section class="tarjeta-oscura seccion-login">
            <h1 class="titulo-seccion">Crear cuenta</h1>
            <form class="formulario-login" action="#" method="post">
                <div class="grupo-campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre completo" required
                        oninvalid="this.setCustomValidity('Por favor, ingrese su nombre.')" oninput="this.setCustomValidity('')">
                </div>
                <div class="grupo-campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="Ingrese su correo electrónico" required
                        oninvalid="this.setCustomValidity('Por favor, ingrese su correo.')" oninput="this.setCustomValidity('')">
                </div>
                <div class="grupo-campo">
                    <label for="clave">Contraseña</label>
                    <input type="password" id="clave" name="clave" placeholder="Cree una contraseña" required
                        oninvalid="this.setCustomValidity('Por favor, cree una contraseña.')" oninput="this.setCustomValidity('')">
                </div>
                <div class="grupo-campo">
                    <label for="clave-confirmar">Confirmar contraseña</label>
                    <input type="password" id="clave-confirmar" name="clave-confirmar" placeholder="Repita su contraseña" required
                        oninvalid="this.setCustomValidity('Por favor, confirme su contraseña.')" oninput="this.setCustomValidity('')">
                </div>
                <div class="acciones-login">
                    <button type="submit" class="btn-iniciar">Registrarme</button>
                    <a href="login.html" class="enlace-olvido">Ya tengo una cuenta</a>
                </div>
            </form>
        </section>
    </main>

    <footer class="pie-pagina">
        <div class="info-footer">
            <p>&copy; 2026 Miraflores Pacific Hotel. Todos los derechos reservados.</p>
            <p>Av. Grau 191, Miraflores, Lima - Perú</p>
        </div>
    </footer>

</body>
</html>
